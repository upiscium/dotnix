name: OpenCode Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test updater lock contract
        run: python3 -m unittest discover -s tests -p 'test_opencode_policy_lock_update.py' -v
      - uses: cachix/install-nix-action@v31
      - name: Evaluate supported systems
        run: nix flake check --all-systems --no-build --no-update-lock-file
      - name: Build Neovim package
        run: nix build .#checks.x86_64-linux.neovim-package --no-link --no-update-lock-file
      - name: Global profile conformity
        run: nix build .#checks.x86_64-linux.opencode-policy --no-link --no-update-lock-file
