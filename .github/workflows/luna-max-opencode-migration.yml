name: One-shot OpenCode Luna Max migration

on:
  push:
    branches: [refactor/opencode-luna-max-safe-roles]
    paths:
      - .github/workflows/luna-max-opencode-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/opencode-luna-max-safe-roles
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Migrate global OpenCode role models
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          agents = root / 'packages' / 'opencode' / 'config' / 'agents'

          migrate = {
              'plan': 'openai/gpt-5.6-sol',
              'reviewer': 'openai/gpt-5.6-terra',
              'investigator': 'openai/gpt-5.6-terra',
          }
          existing_luna = {'general', 'explore', 'verifier', 'scout'}

          for role, old_model in migrate.items():
              path = agents / f'{role}.md'
              text = path.read_text(encoding='utf-8')
              old = f'model: {old_model}\n'
              if old not in text:
                  raise SystemExit(f'missing expected model line in {path}: {old_model}')
              if 'reasoningEffort: max' in text:
                  raise SystemExit(f'unexpected pre-existing max reasoning in {path}')
              text = text.replace(
                  old,
                  'model: openai/gpt-5.6-luna\nreasoningEffort: max\n',
                  1,
              )
              path.write_text(text, encoding='utf-8')

          for role in sorted(existing_luna):
              path = agents / f'{role}.md'
              text = path.read_text(encoding='utf-8')
              marker = 'model: openai/gpt-5.6-luna\n'
              if marker not in text:
                  raise SystemExit(f'missing Luna model line in {path}')
              if 'reasoningEffort: max' in text:
                  raise SystemExit(f'unexpected pre-existing max reasoning in {path}')
              path.write_text(
                  text.replace(marker, marker + 'reasoningEffort: max\n', 1),
                  encoding='utf-8',
              )

          local_worker_test = root / 'tests' / 'test_opencode_local_workers.py'
          text = local_worker_test.read_text(encoding='utf-8')
          old = 'canonical = {"build": "sol", "plan": "sol", "architect": "sol", "reviewer": "terra", "investigator": "terra", "security-reviewer": "terra", "general": "luna", "explore": "luna", "verifier": "luna", "scout": "luna"}'
          new = 'canonical = {"build": "sol", "plan": "luna", "architect": "sol", "reviewer": "luna", "investigator": "luna", "security-reviewer": "terra", "general": "luna", "explore": "luna", "verifier": "luna", "scout": "luna"}'
          if old not in text:
              raise SystemExit('missing canonical assignment fixture')
          local_worker_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = root / 'packages' / 'opencode' / 'config' / 'README.md'
          text = readme.read_text(encoding='utf-8')
          old_table = '''| `build`, `plan`, `architect` | `openai/gpt-5.6-sol` |\n| `reviewer`, `investigator`, `security-reviewer` | `openai/gpt-5.6-terra` |\n| `general`, `explore`, `verifier`, `scout` | `openai/gpt-5.6-luna` |'''
          new_table = '''| `build`, `architect` | `openai/gpt-5.6-sol` |\n| `security-reviewer` | `openai/gpt-5.6-terra` |\n| `plan`, `reviewer`, `investigator`, `general`, `explore`, `verifier`, `scout` | `openai/gpt-5.6-luna` (`reasoningEffort: max`) |'''
          if old_table not in text:
              raise SystemExit('missing OpenCode role/model table')
          readme.write_text(text.replace(old_table, new_table, 1), encoding='utf-8')

          reasoning_test = root / 'tests' / 'test_opencode_luna_reasoning.py'
          reasoning_test.write_text('''from __future__ import annotations\n\nimport re\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nAGENTS = ROOT / "packages" / "opencode" / "config" / "agents"\nLUNA_AGENTS = {"plan", "reviewer", "investigator", "general", "explore", "verifier", "scout"}\nRETAINED_MODELS = {\n    "build": "openai/gpt-5.6-sol",\n    "architect": "openai/gpt-5.6-sol",\n    "security-reviewer": "openai/gpt-5.6-terra",\n}\n\n\ndef frontmatter(path: Path) -> str:\n    text = path.read_text(encoding="utf-8")\n    match = re.match(r"^---\\n(.*?)\\n---\\n", text, flags=re.DOTALL)\n    if not match:\n        raise AssertionError(f"missing frontmatter: {path}")\n    return match.group(1)\n\n\nclass OpenCodeLunaReasoningTest(unittest.TestCase):\n    def test_luna_roles_use_max_reasoning(self) -> None:\n        for role in sorted(LUNA_AGENTS):\n            metadata = frontmatter(AGENTS / f"{role}.md")\n            self.assertIn("model: openai/gpt-5.6-luna", metadata, role)\n            self.assertIn("reasoningEffort: max", metadata, role)\n\n    def test_retained_high_tier_roles_remain_explicit(self) -> None:\n        for role, model in RETAINED_MODELS.items():\n            metadata = frontmatter(AGENTS / f"{role}.md")\n            self.assertIn(f"model: {model}", metadata, role)\n            self.assertNotIn("reasoningEffort: max", metadata, role)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Update OpencodeContract lock
        shell: bash
        run: |
          set -euo pipefail
          nix flake update opencodeContract
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = '8c718bfebd835e3b2192b8c675319fe655c6ebce'
          lock = json.loads(Path('flake.lock').read_text(encoding='utf-8'))
          actual = lock['nodes']['opencodeContract']['locked']['rev']
          if actual != expected:
              raise SystemExit(f'OpencodeContract revision mismatch: expected {expected}, got {actual}')
          PY

      - name: Verify migration
        run: |
          python3 -m unittest discover -s tests -v
          nix build .#checks.x86_64-linux.opencode-contract --no-link --no-update-lock-file

      - name: Commit migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/luna-max-opencode-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: migrate global OpenCode roles to Luna Max'
          git push origin HEAD:refactor/opencode-luna-max-safe-roles
